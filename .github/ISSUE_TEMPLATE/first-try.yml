name: How did your first try go?
description: You installed cue for the first time. Tell us where it was easy and where you got stuck.
labels: ["first-try"]
body:
  - type: markdown
    attributes:
      value: Thanks for trying cue! Short answers are perfect. Please don't paste private links or anything personal.
  - type: dropdown
    id: result
    attributes:
      label: Did you get your first episode in Notion?
      options:
        - Yes, without help
        - Yes, but I needed help
        - No, I gave up
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: Where did you stop or hesitate?
      description: "For example: finding the Code tab, connecting Notion, a permission request you didn't understand, the setup questions."
  - type: input
    id: time
    attributes:
      label: Roughly how long did it take, from install to your first page?
      placeholder: "e.g. 15 minutes"
  - type: input
    id: system
    attributes:
      label: Your computer
      placeholder: "e.g. Windows 11 laptop, MacBook Air M2"
  - type: textarea
    id: other
    attributes:
      label: Anything else? What would you change?
